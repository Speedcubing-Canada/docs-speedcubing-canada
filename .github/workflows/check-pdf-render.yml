name: Check PDF render

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "index.js"
      - "styles/**/*.css"
      - ".github/workflows/check-pdf-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm1 libnss3 libxss1 poppler-utils

      - name: Render by-laws
        run: |
          # Delete the committed PDF so the size check can't pass on a stale file.
          rm -f public/pdf/by-laws.pdf
          node index.js public by-laws
          test -s public/pdf/by-laws.pdf

      - name: Check PDF titles
        run: |
          # Regression check for the PDF title that index.js sets (see documentTitle).
          # by-laws.md has no heading, so its title is its file name, capitalized.
          # The minutes have a heading and a "Date:" line, so their title is "heading (date)".
          # by-laws.pdf was rendered in the previous step. Delete the committed minutes
          # PDF before rendering a new one, so the check can't pass on a stale file.
          rm -f public/pdf/directors-meeting-oct-9-2023.pdf
          node index.js public directors-meeting-oct-9-2023
          pdfinfo public/pdf/by-laws.pdf | grep -x "Title: *By-laws"
          pdfinfo public/pdf/directors-meeting-oct-9-2023.pdf | grep -x "Title: *Directors' Meeting - Speedcubing Canada (October 9, 2023)"

      - name: Upload rendered PDF
        uses: actions/upload-artifact@v7
        with:
          name: by-laws-pdf
          path: public/pdf/by-laws.pdf
